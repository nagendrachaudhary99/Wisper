services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wisper
      POSTGRES_PASSWORD: wisper
      POSTGRES_DB: wisper
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wisper -d wisper"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.24.2
    depends_on:
      temporal-db:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: temporal-db
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig

  temporal-ui:
    profiles: ["app"]
    image: temporalio/ui:2.31.2
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports: ["127.0.0.1:8233:8080"]

  api:
    profiles: ["app"]
    build: .
    command: pnpm dev:api
    depends_on: { db: { condition: service_healthy }, temporal: { condition: service_started } }
    environment:
      DATABASE_URL: postgres://wisper:wisper@db:5432/wisper
      TEMPORAL_ADDRESS: temporal:7233
      PROVIDER_MODE: fake
    ports: ["127.0.0.1:3001:3001"]

  worker:
    profiles: ["app"]
    build: .
    command: pnpm dev:worker
    depends_on: { db: { condition: service_healthy }, temporal: { condition: service_started } }
    environment:
      DATABASE_URL: postgres://wisper:wisper@db:5432/wisper
      TEMPORAL_ADDRESS: temporal:7233
      PROVIDER_MODE: fake

  web:
    profiles: ["app"]
    build: .
    command: pnpm dev:web --host 0.0.0.0
    depends_on: [api]
    ports: ["127.0.0.1:5173:5173"]

  companion:
    profiles: ["app"]
    build: .
    command: pnpm --filter @wisper/companion dev
    environment:
      WISPER_WORKSPACE_ROOT: /workspace
      COMPANION_HOST: 0.0.0.0
      WISPER_ALLOWED_COMMANDS: pwd,ls,git,node,pnpm
      WISPER_COMPANION_DISABLED: ${WISPER_COMPANION_DISABLED:-0}
    volumes: ["./:/workspace"]
    ports: ["127.0.0.1:7337:7337"]

volumes:
  db-data:
  temporal-db-data:
